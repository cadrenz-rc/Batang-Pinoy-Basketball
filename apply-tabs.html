<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPBL Tabs Installer</title><style>body{font:16px system-ui;margin:0;background:#06132e;color:white}main{max-width:690px;margin:5rem auto;padding:2rem;background:#10234c;border-radius:18px}button{background:#fcd116;padding:14px 20px;font-weight:700;border:0;border-radius:8px;cursor:pointer;margin-top:18px}input{display:block;margin-top:16px}p{line-height:1.6}code{color:#ffe57d}</style></head><body><main><h1>BPBL — Three Tabs Installer</h1><p>Select the <code>index.html</code> file you downloaded from your BPBL GitHub repository. This creates an updated <code>index.html</code> with Standings, League Leaders, and Previous Matchups tabs, without changing your stats.</p><input type="file" id="file" accept=".html,text/html"><button id="go">Create updated index.html</button><p id="status"></p></main><script>document.getElementById('go').onclick=async()=>{let f=document.getElementById('file').files[0];if(!f){document.getElementById('status').textContent='Select your existing index.html first.';return;}let s=await f.text();if(!s.includes('id="standings"')||!s.includes('id="leaders"')||!s.includes('id="results"')){document.getElementById('status').textContent='This file does not look like the BPBL website.';return;}if(!s.includes('bpbl-tabs.js'))s=s.replace(/<\/body>/i,'<script src="bpbl-tabs.js" defer><\/script>\n</body>');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/html'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);document.getElementById('status').textContent='Updated index.html created. Upload it and bpbl-tabs.js to GitHub.';};</script></body></html>
